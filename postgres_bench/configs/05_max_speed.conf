# Max speed: all durability and background maintenance disabled.
# Minimal WAL, no fsync, rare checkpoints, background writer off.
# DO NOT use in production.  For ephemeral benchmark instances only.

shared_buffers          = 32MB
fsync                   = off
synchronous_commit      = off
full_page_writes        = off
wal_level               = minimal
max_wal_senders         = 0
checkpoint_timeout      = 60min
checkpoint_completion_target = 0.9
bgwriter_lru_maxpages   = 0
bgwriter_delay          = 10000ms
